name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }} (${{ matrix.status }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # EOL runtimes are compatibility checks, not a security-support promise.
          - node: 18
            status: legacy compatibility
          - node: 20
            status: legacy compatibility
          - node: 22
            status: maintenance LTS
          - node: 24
            status: maintenance LTS
          - node: 26
            status: active LTS
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      # npm test builds; do not add a redundant standalone build here.
      - run: npm test
      - run: npm run lint
      - run: npm run test:package
      - run: npm run example:mga2020
      - run: npm run example:utm
